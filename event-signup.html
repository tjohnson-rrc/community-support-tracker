<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Signup</title>
    <link rel="stylesheet" href="./event-signup-styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav-bar" id="field_nav-bar">
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Donation Tracker</a></li>
                <li><a href="#">Volunteer Hours Tracker</a></li>
            </ul>
        </nav>       
    </header>
    
    <form id="eventSignup">
    <fieldset>
        <legend><h1>Event Signup Form</h1></legend>

        <div class="input-container">
            <label for="field_event-name">Event Name</label>
            <input type="text" name="event-name" id="field_event-name"/> 
        </div>

        <div class="input-container">
            <label for="field_rep-name">Representative Name</label>
            <input type="text" name="rep-name" id="field_rep-name"/> 
        </div>

        <div class="input-container">
            <label for="field_email">Representative Email</legend>
            <input type="text" name="email" id="field_email"/> 
        </div>

        <div class="input-container">
            <label for="field_role-selection">Event Role Selection</label>
            <select name="role-selection" id="field_role-selection">
                <option value="">Please choose the company's role for this event!</option>
                <option value="sponsor">Sponsorship</option>
                <option value="participant">Participant</option>
                <option value="organizer">Organizer</option>
                <option value="volunteer">Volunteer Provider</option>
            </select>
        </div>
        <button type="submit">Submit Form</button>
    </fieldset>
</form>
<footer class="footer"> © 2025 PIXELL River Financial. All rights reserved.</footer>
<script src="./event-signup.js"></script>
</body>
</html>
